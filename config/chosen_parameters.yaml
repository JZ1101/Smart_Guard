# ============================================================================
# SMART_GUARD - OPTIMIZED PARAMETERS
# ============================================================================
# This configuration file contains the best parameters found through
# random parameter tuning (20 combinations tested).
#
# The parameters were optimized to maximize jailbreak detection while
# maintaining reasonable false positive rates on benign prompts.
#
# Performance Achieved:
#   - Jailbreak Detection Rate: 100.0% (666/666 attacks detected)
#   - Benign Allow Rate: 69.5% (153/220 benign prompts allowed)
#   - Overall Accuracy: 92.4%
#   - Precision: 0.909 (low false positives)
#   - Recall: 1.000 (no attacks missed)
#   - F1 Score: 0.9521 (excellent balance)
#
# ============================================================================

# PATTERN MATCHING THRESHOLD
# Range: 0.0 to 1.0
# Description:
#   Controls how aggressively pattern-based keyword matching detects attacks.
#   Lower values = more pattern matches trigger threat detection.
#   Higher values = fewer pattern matches are detected (more lenient).
#
# Interpretation:
#   - 0.0: Every keyword match is flagged as a threat
#   - 0.5: Moderate keyword matching required for detection
#   - 1.0: Very high keyword density required (almost never triggers)
#
# Value: 0.1202
#   Slightly above threshold, allowing most jailbreak patterns to be caught.
#   This is significantly lower than the baseline (0.3), making pattern
#   detection much more sensitive to jailbreak keywords and phrases.
pattern_threshold: 0.1202


# JAILBREAK BOOST MULTIPLIER
# Range: 1.0 to 5.0
# Description:
#   Amplifies the embedding-based jailbreak score to increase detection.
#   Multiplies the cosine similarity score for jailbreak-type embeddings.
#   Higher values = more aggressive jailbreak detection.
#
# Interpretation:
#   - 1.0: No amplification (neutral baseline)
#   - 1.5: 50% amplification of jailbreak scores
#   - 2.0: 100% amplification (double the score)
#   - 3.0+: Very aggressive detection
#
# Value: 1.1452
#   Moderate boost that flags more prompts as potential jailbreaks without
#   being overly aggressive. This helps catch subtle attack attempts.
jailbreak_boost: 1.1452


# BENIGN PENALTY MULTIPLIER
# Range: 0.0 to 1.0
# Description:
#   Reduces the confidence in benign classifications to prevent false negatives.
#   Multiplies the cosine similarity score for benign-type embeddings.
#   Lower values = more prompts classified as threats (less benign).
#
# Interpretation:
#   - 0.0: Completely disables benign classification (everything is a threat)
#   - 0.2: 80% penalty - rarely accepts benign classification
#   - 0.5: 50% penalty - balanced approach
#   - 1.0: No penalty (neutral baseline)
#
# Value: 0.6197
#   Moderate penalty that discourages benign classification without
#   making it impossible. This ensures suspicious prompts aren't mistakenly
#   allowed through as benign.
benign_penalty: 0.6197


# ATTACK FALLBACK THRESHOLD
# Range: 0.0 to 0.5
# Description:
#   Minimum confidence threshold for classifying as an attack type
#   when the primary classification is uncertain.
#   Used when main confidence score is below confidence_threshold.
#   Lower values = easier to classify as attack when uncertain.
#
# Interpretation:
#   - 0.05: Very low bar - almost any suspicious signal triggers attack classification
#   - 0.15: Moderate bar - needs some evidence of attack
#   - 0.25: Higher bar - needs clear evidence before fallback to attack
#   - 0.5: Very high bar - rarely triggers fallback classification
#
# Value: 0.1702
#   Low-to-moderate fallback threshold ensuring uncertain prompts are
#   classified as attacks (safer default). This provides defense-in-depth
#   against edge cases and novel attack patterns.
attack_fallback: 0.1702


# CONFIDENCE THRESHOLD
# Range: 0.0 to 1.0
# Description:
#   Minimum confidence level required before accepting the primary classification.
#   If confidence is below this threshold, uses fallback classification logic.
#   Higher values = only accept high-confidence classifications.
#
# Interpretation:
#   - 0.1: Very lenient - accepts low-confidence predictions
#   - 0.3: Moderate confidence required
#   - 0.5: High confidence required
#   - 0.8: Very high confidence required
#
# Value: 0.3624
#   Moderate confidence threshold allowing reasonable predictions while
#   requiring verification through fallback logic for uncertain cases.
#   This creates a two-tier decision process for edge cases.
confidence_threshold: 0.3624


# ============================================================================
# PARAMETER OPTIMIZATION NOTES
# ============================================================================
#
# Optimization Method: Uniform Random Sampling
#   - Tested 20 random parameter combinations
#   - Execution time: ~20 minutes
#   - Best F1 Score: 0.5185 (during random search)
#   - Final F1 Score: 0.9521 (full benchmark with best params)
#
# Key Insights:
#   1. Pattern threshold was the critical bottleneck (baseline: 0.3 → optimal: 0.12)
#      Lowering this enabled much faster jailbreak detection via keyword matching.
#
#   2. Jailbreak boost stayed moderate (1.145) - aggressive boosting actually
#      reduced performance by causing false positives on legitimate prompts.
#
#   3. Benign penalty of 0.62 struck the balance between:
#      - Not blocking too many legitimate prompts (avoiding excessive false positives)
#      - Being conservative enough to catch all attacks (100% recall)
#
#   4. Low attack fallback (0.17) ensures uncertain prompts default to "threat"
#      This "fail safe" approach prioritizes security over user experience.
#
#   5. Confidence threshold at 0.36 creates a two-tier system:
#      - High-confidence predictions are trusted immediately
#      - Low-confidence predictions use fallback logic (safer default)
#
# Trade-offs:
#   ✓ Achieved 100% jailbreak detection (zero attacks slip through)
#   ⚠ 69.5% benign allow rate (30.5% false positive rate)
#     This is acceptable for security-critical applications where
#     false negatives (missing attacks) are worse than false positives
#     (blocking legitimate prompts).
#
