[project]
name = "smart-guard"
version = "0.1.0"
requires-python = ">=3.9"
dependencies = [
    "anthropic>=0.34.0",
    "sentence-transformers>=2.2.0",
    "numpy>=1.24.0",
    "pandas>=2.3.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["model_guard"]
