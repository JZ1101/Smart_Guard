[project]
name = "smart-guard"
version = "0.1.0"
requires-python = ">=3.9"
dependencies = [
    "anthropic>=0.34.0",
    "sentence-transformers>=2.2.0",
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "python-dotenv>=1.0.0",
    "torch>=2.1.0",
]

[project.optional-dependencies]
# Optional providers
llama = ["replicate>=0.15.0"]
nemo = ["nemoguardrails>=0.7.0"]
openai = ["openai>=1.3.0"]

# All optional features
all = [
    "replicate>=0.15.0",
    "nemoguardrails>=0.7.0",
    "openai>=1.3.0",
    "transformers>=4.35.0",
    "accelerate>=0.24.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["model_guard"]
